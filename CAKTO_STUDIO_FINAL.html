<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0e">
<title>CAKTO Studio — Sites que vendem</title>
<style>
:root{
  --bg:#08090c;--panel:#111318;--panel2:#17191f;--panel3:#1d2028;--line:#292d36;
  --text:#f7f7f8;--muted:#9da3ae;--accent:#ff3151;--accent2:#ff6b35;--green:#18d985;
  --blue:#4d8dff;--shadow:0 18px 60px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:active{transform:scale(.98)}
.app{min-height:100vh}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:270px;background:#0e1014;border-right:1px solid var(--line);padding:20px 14px;z-index:50;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:12px;padding:8px 10px 24px}
.brandmark{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));font-size:23px;box-shadow:0 0 30px rgba(255,49,81,.25)}
.brand h1{font-size:21px;margin:0}.brand p{font-size:11px;color:var(--muted);margin:3px 0 0}
.nav{display:flex;flex-direction:column;gap:5px}
.nav button{width:100%;border:0;background:transparent;color:var(--muted);padding:13px 14px;border-radius:10px;text-align:left;display:flex;align-items:center;gap:11px}
.nav button:hover{background:var(--panel2);color:#fff}
.nav button.active{background:var(--accent);color:#fff;box-shadow:0 8px 24px rgba(255,49,81,.18)}
.side-bottom{margin-top:auto}.side-bottom button{width:100%;padding:12px;border:1px solid var(--line);background:var(--panel2);color:#ff778c;border-radius:10px}
.main{margin-left:270px;min-height:100vh;padding:28px;max-width:1500px}
.mobilebar{display:none}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
.page-head h2{font-size:30px;margin:0 0 5px}.page-head p{margin:0;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:var(--shadow)}
.hero{background:radial-gradient(circle at 85% 10%,rgba(255,49,81,.18),transparent 35%),linear-gradient(135deg,#14151b,#0d0e12);overflow:hidden}
.hero h2{font-size:clamp(28px,4vw,48px);line-height:1.05;margin:0 0 12px}.hero p{font-size:17px;color:#b7bcc5;max-width:720px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:18px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:34px;margin-top:6px}
.btn{border:0;border-radius:10px;padding:12px 17px;font-weight:750;transition:.18s;min-height:44px}
.btn.primary{background:var(--accent);color:white;box-shadow:0 8px 24px rgba(255,49,81,.18)}.btn.secondary{background:var(--panel2);color:#fff;border:1px solid var(--line)}
.btn.green{background:var(--green);color:#03140d}.btn.blue{background:var(--blue);color:white}
.btn:disabled{opacity:.45;cursor:not-allowed}
.form{display:grid;gap:15px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:#e5e7eb}
input,textarea,select{width:100%;background:var(--panel2);color:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 13px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,49,81,.12)}
textarea{resize:vertical;min-height:100px}
.chips{display:flex;flex-wrap:wrap;gap:9px}.chip{border:1px solid var(--line);background:var(--panel2);color:#cbd0d8;border-radius:999px;padding:10px 14px}.chip.active{border-color:var(--accent);background:rgba(255,49,81,.13);color:#ff8196}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.stepper{display:flex;align-items:center;gap:8px;margin-bottom:20px;overflow:auto;padding-bottom:3px}.step{display:flex;align-items:center;gap:7px;white-space:nowrap;color:var(--muted);font-size:12px}.dot{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:var(--panel3);border:1px solid var(--line);font-weight:800}.step.active{color:#fff}.step.active .dot{background:var(--accent);border-color:var(--accent)}.step.done .dot{background:var(--green);color:#03140d;border-color:var(--green)}.connector{height:2px;width:35px;background:var(--line);flex:0 0 auto}.connector.done{background:var(--green)}
.preview{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:linear-gradient(135deg,#13253e,#26112e);min-height:320px;display:flex;align-items:center;justify-content:center;padding:25px;text-align:center;position:relative}
.preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.25}.preview-content{position:relative;z-index:2;max-width:700px}.preview h3{font-size:clamp(28px,4vw,46px);margin:0 0 10px}.preview p{color:#e2e5eb;line-height:1.55}.preview .price{font-size:32px;font-weight:900;margin:20px}
.library-toolbar{display:grid;grid-template-columns:1fr auto;gap:10px}.image-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}.image-card{border:1px solid var(--line);background:var(--panel2);border-radius:12px;overflow:hidden;position:relative}.image-card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}.image-card button{width:100%;border:0;background:var(--panel3);color:#fff;padding:10px}.image-card .check{position:absolute;right:8px;top:8px;background:var(--green);color:#00170d;border-radius:999px;padding:4px 7px;font-size:11px;font-weight:800}
.library-note{color:var(--muted);font-size:12px;line-height:1.5}
.result{display:flex;gap:12px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);padding:14px;border-radius:12px;margin-top:10px}.result-icon{width:42px;height:42px;border-radius:10px;background:var(--panel3);display:grid;place-items:center;flex:0 0 auto}.result-body{flex:1}.result-title{font-weight:800}.result-meta{color:var(--muted);font-size:12px;margin-top:3px}.result a{color:#7fa9ff;text-decoration:none}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.tab{border:1px solid var(--line);background:var(--panel2);color:var(--muted);padding:9px 13px;border-radius:9px}.tab.active{background:#252934;color:#fff;border-color:#454b58}
.list{display:grid;gap:10px}.item{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px}.item-main{flex:1}.item-title{font-weight:800}.item-sub{font-size:12px;color:var(--muted);margin-top:3px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);opacity:0;background:#fff;color:#111;padding:13px 18px;border-radius:10px;font-weight:800;z-index:9999;transition:.25s;box-shadow:0 14px 40px rgba(0,0,0,.35);max-width:90vw;text-align:center}.toast.show{transform:translate(-50%,0);opacity:1}.toast.error{background:#ff3d5a;color:#fff}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:none}.overlay.show{display:block}
.empty{text-align:center;padding:50px 15px;color:var(--muted)}.empty strong{display:block;color:#fff;font-size:18px;margin-bottom:6px}
.badge{display:inline-flex;padding:5px 8px;border-radius:999px;background:rgba(24,217,133,.12);color:#54eaa5;font-size:11px;font-weight:800}
@media(max-width:1050px){.grid{grid-template-columns:1fr 1fr}.image-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:800px){
 .sidebar{transform:translateX(-105%);transition:.25s;width:280px;box-shadow:20px 0 60px rgba(0,0,0,.5)}.sidebar.open{transform:translateX(0)}
 .main{margin:0;padding:78px 14px 25px}.mobilebar{display:flex;position:fixed;top:0;left:0;right:0;height:62px;background:#0e1014;border-bottom:1px solid var(--line);z-index:60;align-items:center;padding:8px 12px;gap:12px}.hamb{width:46px;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:#fff;font-size:24px}.mobile-title{font-weight:850;font-size:18px}.grid,.grid2{grid-template-columns:1fr}.image-grid{grid-template-columns:repeat(2,1fr)}.page-head{align-items:flex-start;flex-direction:column}.page-head h2{font-size:26px}.card{padding:17px}.stepper{justify-content:flex-start}.connector{width:18px}
}

.client-site{background:#fff;color:#111;border-radius:18px;overflow:hidden;margin-top:18px;box-shadow:0 20px 70px rgba(0,0,0,.35)}
.client-hero{min-height:430px;display:flex;align-items:center;justify-content:center;text-align:center;padding:70px 24px;position:relative;background:linear-gradient(135deg,#111827,#3b0764);color:#fff;overflow:hidden}
.client-hero.has-image{background-size:cover;background-position:center}
.client-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28),rgba(0,0,0,.72))}
.client-hero-content{position:relative;z-index:2;max-width:820px}
.client-hero h1{font-size:clamp(34px,6vw,70px);line-height:1.03;margin:16px 0}
.client-hero p{font-size:18px;line-height:1.7;opacity:.94;margin:0 auto 25px;max-width:680px}
.client-cta{display:inline-flex;padding:15px 25px;border-radius:10px;background:#ff3151;color:#fff;text-decoration:none;font-weight:800}
.client-section{padding:55px 8%;text-align:center}
.client-section h2{font-size:32px;margin:0 0 12px}.client-section p{line-height:1.7;color:#555;max-width:760px;margin:0 auto}
.client-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px;text-align:left}
.client-card{padding:22px;border:1px solid #e5e7eb;border-radius:14px;background:#fafafa}.client-card h3{margin:0 0 8px}.client-card p{font-size:14px;color:#666}
.client-contact{background:#111827;color:#fff;padding:55px 8%;text-align:center}.client-contact h2{margin-top:0;font-size:32px}.client-contact p{color:#cbd5e1}
.preview-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.preview-actions .btn{flex:1;min-width:170px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:500;display:none;padding:22px;overflow:auto}
.modal.show{display:block}
.modal-inner{max-width:1100px;margin:0 auto;background:#f3f4f6;border-radius:18px;overflow:hidden}
.modal-top{position:sticky;top:0;z-index:3;background:#111318;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal-top .btn{min-height:40px;padding:9px 13px}
@media(max-width:800px){.client-cards{grid-template-columns:1fr}.client-section{padding:40px 22px}.client-contact{padding:40px 22px}.modal{padding:8px}.preview-actions .btn{min-width:100%}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
<div class="overlay" id="overlay"></div>
<div class="mobilebar"><button class="hamb" id="menuBtn" type="button">☰</button><div class="mobile-title">CAKTO 🌵 Studio</div></div>

<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brandmark">🌵</div><div><h1>CAKTO Studio</h1><p>Crie sites que vendem</p></div></div>
  <nav class="nav" id="nav">
    <button type="button" data-view="dashboard">📊 <span>Dashboard</span></button>
    <button type="button" data-view="builder">✨ <span>Criar site</span></button>
    <button type="button" data-view="projects">🗂️ <span>Meus sites</span></button>
    <button type="button" data-view="leads">🎯 <span>Encontrar clientes</span></button>
    <button type="button" data-view="images">🖼️ <span>Biblioteca de imagens</span></button>
    <button type="button" data-view="copy">✍️ <span>Gerador de Copy</span></button>
    <button type="button" data-view="creative">🎬 <span>Criativos</span></button>
    <button type="button" data-view="settings">⚙️ <span>Configurações</span></button>
  </nav>
  <div class="side-bottom"><button type="button" data-action="logout">🚪 Sair</button></div>
</aside>

<main class="main" id="content"></main>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ==========================================================
   CAKTO STUDIO — aplicação sem frameworks.
   Todos os botões usam delegação de eventos, portanto os
   elementos criados depois pelo render() continuam funcionando.
========================================================== */

const state = {
  view:"dashboard",
  step:1,
  niche:"",
  site:{name:"",business:"",description:"",phone:"",city:"",style:"Moderno",headline:"",cta:"FALAR NO WHATSAPP",image:""},
  imagePage:1,
  imageQuery:"",
  imageBusy:false,
  leadPlatform:"Todos"
};

const niches=[
 "Restaurante","Barbearia","Salão de beleza","Clínica","Dentista","Academia",
 "Loja de roupas","Pet shop","Imobiliária","Advocacia","Contabilidade",
 "Oficina mecânica","Autopeças","Pizzaria","Padaria","Mercado",
 "Fotógrafo","Eletricista","Encanador","Marcenaria","Hotel/Pousada",
 "E-commerce","Prestador de serviços","Outro"
];

const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg,error=false){
 const t=$("#toast"); t.textContent=msg; t.className="toast show"+(error?" error":"");
 clearTimeout(window.__toast); window.__toast=setTimeout(()=>t.className="toast",3000);
}
function read(key){try{return JSON.parse(localStorage.getItem(key)||"[]")}catch{return[]}}
function write(key,val){localStorage.setItem(key,JSON.stringify(val))}
function closeMenu(){ $("#sidebar").classList.remove("open"); $("#overlay").classList.remove("show") }
function openMenu(){ $("#sidebar").classList.add("open"); $("#overlay").classList.add("show") }
function navigate(view){state.view=view;closeMenu();render()}

function layoutHead(title,sub,button=""){
 return `<div class="page-head"><div><h2>${title}</h2><p>${sub}</p></div>${button}</div>`;
}

/* ---------- DASHBOARD ---------- */
function renderDashboard(){
 const sites=read("cakto_sites"), leads=read("cakto_leads");
 $("#content").innerHTML=`
 ${layoutHead("Olá 👋","Seu estúdio para criar sites profissionais e encontrar clientes.")}
 <section class="card hero">
   <h2>Crie sites profissionais para empresas e comércios.</h2>
   <p>Escolha o nicho, monte a identidade, escolha imagens visualmente, gere textos e publique uma apresentação pronta para vender seu serviço.</p>
   <div class="actions"><button class="btn primary" type="button" data-action="new-site">✨ Criar novo site</button><button class="btn secondary" type="button" data-view="leads">🎯 Encontrar clientes</button></div>
 </section>
 <div class="grid">
   <div class="stat"><small>Sites criados</small><strong>${sites.length}</strong></div>
   <div class="stat"><small>Clientes salvos</small><strong>${leads.length}</strong></div>
   <div class="stat"><small>Nicho atual</small><strong style="font-size:22px">${esc(state.niche||"—")}</strong></div>
 </div>
 <section class="card">
   <h3 style="margin-top:0">Como funciona</h3>
   <div class="grid2">
    <div class="item"><div>1️⃣</div><div class="item-main"><div class="item-title">Escolha um nicho</div><div class="item-sub">Restaurante, barbearia, clínica, loja e muito mais.</div></div></div>
    <div class="item"><div>2️⃣</div><div class="item-main"><div class="item-title">Monte o site</div><div class="item-sub">Cores, textos, imagem, WhatsApp e prévia.</div></div></div>
    <div class="item"><div>3️⃣</div><div class="item-main"><div class="item-title">Encontre empresas</div><div class="item-sub">Pesquise oportunidades públicas por nicho e plataforma.</div></div></div>
    <div class="item"><div>4️⃣</div><div class="item-main"><div class="item-title">Venda seu serviço</div><div class="item-sub">Salve leads e abra os resultados públicos para contato.</div></div></div>
   </div>
 </section>`;
}

/* ---------- SITE BUILDER ---------- */
function renderBuilder(){
 const s=state.site;
 const steps=["Nicho","Empresa","Visual","Imagem","Prévia"];
 $("#content").innerHTML=`
 ${layoutHead("Criar site","Monte um site demonstrativo para apresentar a uma empresa ou comércio.")}
 <div class="stepper">${steps.map((x,i)=>`<div class="step ${state.step===i+1?"active":""} ${state.step>i+1?"done":""}"><span class="dot">${state.step>i+1?"✓":i+1}</span><span>${x}</span></div>${i<4?`<span class="connector ${state.step>i+1?"done":""}"></span>`:""}`).join("")}</div>
 <div id="builderStep"></div>`;
 renderBuilderStep();
}
function renderBuilderStep(){
 const el=$("#builderStep"),s=state.site;
 if(state.step===1){
  el.innerHTML=`<section class="card"><h3 style="margin-top:0">1. Qual é o nicho?</h3><p style="color:var(--muted)">O nicho será usado para sugerir estrutura, texto e pesquisas de clientes.</p>
   <div class="chips">${niches.map(n=>`<button class="chip ${state.niche===n?"active":""}" type="button" data-niche="${esc(n)}">${esc(n)}</button>`).join("")}</div>
   <div class="actions" style="margin-top:22px"><button class="btn secondary" type="button" data-view="dashboard">Cancelar</button><button class="btn primary" type="button" data-action="next-step" ${state.niche?"":"disabled"}>Continuar →</button></div>
  </section>`;
 } else if(state.step===2){
  el.innerHTML=`<section class="card"><h3 style="margin-top:0">2. Dados da empresa</h3>
   <div class="grid2">
    ${field("Nome do site/empresa","siteName",s.name,"Ex.: Bella Pizzaria")}
    ${field("Tipo de negócio","business",s.business||state.niche,"Ex.: Pizzaria artesanal")}
    ${field("Cidade / região","city",s.city,"Ex.: São Paulo - SP")}
    ${field("WhatsApp","phone",s.phone,"Ex.: 5511999999999")}
   </div>
   ${field("Descrição curta","description",s.description,"O que a empresa oferece?")}
   <div class="actions"><button class="btn secondary" type="button" data-action="prev-step">← Voltar</button><button class="btn primary" type="button" data-action="next-step">Continuar →</button></div>
  </section>`;
 } else if(state.step===3){
  el.innerHTML=`<section class="card"><h3 style="margin-top:0">3. Visual do site</h3>
   <div class="grid2">
    <div class="field"><label>Estilo</label><select id="siteStyle"><option>Moderno</option><option>Luxo</option><option>Minimalista</option><option>Impactante</option><option>Elegante</option></select></div>
    ${field("Título principal","headline",s.headline||`Seu ${state.niche.toLowerCase()} merece um site profissional`, "Ex.: O sabor que transforma seu dia")}
   </div>
   ${field("Texto do botão","cta",s.cta,"Ex.: PEDIR AGORA")}
   <div class="actions"><button class="btn secondary" type="button" data-action="prev-step">← Voltar</button><button class="btn primary" type="button" data-action="next-step">Continuar →</button></div>
  </section>`;
   $("#siteStyle").value=s.style||"Moderno";
 } else if(state.step===4){
  el.innerHTML=`<section class="card"><h3 style="margin-top:0">4. Escolha a imagem</h3>
   <p style="color:var(--muted)">Você pode pesquisar imagens públicas ou escolher uma foto diretamente do celular/computador.</p>
   <div class="actions"><button class="btn primary" type="button" data-action="open-library">🖼️ Abrir biblioteca</button><button class="btn secondary" type="button" data-action="device-image">📁 Escolher do dispositivo</button><input id="deviceInput" type="file" accept="image/*" hidden></div>
   ${s.image?`<div style="margin-top:18px"><img src="${esc(s.image)}" style="width:100%;max-height:320px;object-fit:cover;border-radius:14px;border:1px solid var(--line)"></div>`:""}
   <div class="actions"><button class="btn secondary" type="button" data-action="prev-step">← Voltar</button><button class="btn primary" type="button" data-action="next-step">Continuar →</button></div>
  </section>`;
 } else {
  el.innerHTML=`<section class="card"><h3 style="margin-top:0">5. Prévia completa do site</h3>
<p style="color:var(--muted)">Agora você pode mostrar o site inteiro para o cliente avaliar antes de entregar.</p>
${sitePreview()}
<div class="preview-actions">
 <button class="btn secondary" type="button" data-action="prev-step">← Voltar</button>
 <button class="btn blue" type="button" data-action="full-preview">👁️ Ver site completo</button>
 <button class="btn green" type="button" data-action="download-site">💻 Baixar site HTML</button>
 <button class="btn primary" type="button" data-action="download-pdf">📄 Baixar PDF</button>
 <button class="btn secondary" type="button" data-action="save-site">💾 Salvar projeto</button>
 <button class="btn primary" type="button" data-action="publish-demo">🌍 Publicar demonstração</button>
</div></section>`;
 }
}
function field(label,id,value,placeholder){
 return `<div class="field"><label>${label}</label><input id="${id}" value="${esc(value)}" placeholder="${esc(placeholder)}"></div>`;
}
function collectBuilder(){
 const s=state.site;
 const ids=["siteName","business","city","phone","description","headline","cta"];
 ids.forEach(id=>{const e=$("#"+id);if(e)s[id==="siteName"?"name":id]=e.value.trim()});
 const st=$("#siteStyle");if(st)s.style=st.value;
}
function clientSiteMarkup(){
 const s=state.site||{};
 const title=s.headline||`Seu ${state.niche||"negócio"} merece um site profissional`;
 const desc=s.description||"Apresente seus produtos e serviços de forma profissional e facilite o contato com seus clientes.";
 const business=s.name||"Sua empresa";
 const niche=state.niche||"EMPRESA";
 const cta=s.cta||"FALAR NO WHATSAPP";
 const img=s.image||"";
 const imageStyle=img?`style="background-image:url('${esc(img)}')"`:"";
 const phone=(s.phone||"").replace(/\D/g,"");
 const href=phone?`https://wa.me/${phone}`:"#";

async function searchImages(){
 if(state.imageBusy)return;
 state.imageBusy=true;
 const q=state.imageQuery.trim()||state.niche||"business";
 const target=$("#imageResults"); if(!target)return;
 target.innerHTML=`<div class="empty">⏳ Procurando imagens públicas...</div>`;
 try{
   const url=`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(q)}&gsrnamespace=6&gsrlimit=24&prop=imageinfo&iiprop=url%7Cmime&iiurlwidth=500&format=json&origin=*`;
   const res=await fetch(url);
   if(!res.ok)throw new Error("Falha");
   const data=await res.json();
   const pages=Object.values(data.query?.pages||{}).filter(p=>p.imageinfo?.[0]?.url && /^image\//.test(p.imageinfo[0].mime||""));
   if(!pages.length){target.innerHTML=`<div class="empty"><strong>Nenhuma imagem encontrada</strong>Tente outro termo.</div>`;return}
   target.innerHTML=`<div class="image-grid">${pages.map(p=>{
      const info=p.imageinfo[0],src=info.thumburl||info.url;
      return `<div class="image-card"><img loading="lazy" src="${esc(src)}" alt="${esc(p.title)}"><button type="button" data-use-image="${esc(src)}">✓ Usar esta imagem</button></div>`;
   }).join("")}</div>`;
 }catch(e){
   target.innerHTML=`<div class="empty"><strong>Não consegui carregar a biblioteca agora.</strong>Verifique a internet e tente novamente.</div>`;
 }finally{state.imageBusy=false}
}

function buildQueries(){
 const n=state.niche, city=$("#leadCity")?.value.trim()||"";

 const p=state.leadPlatform;
 const common=[
  `\"${n}\" \"WhatsApp\"${suffix}`,
  `\"${n}\" \"wa.me\"${suffix}`,
  `site:facebook.com \"${n}\"${suffix}`,
  `site:instagram.com \"${n}\"${suffix}`,
  `site:google.com/maps \"${n}\"${suffix}`
 ];
 if(p==="WhatsApp")return [`\"${n}\" \"chat.whatsapp.com\"${suffix}`,`\"${n}\" \"wa.me\"${suffix}`];
 if(p==="Facebook")return [`site:facebook.com/groups \"${n}\"${suffix}`,`site:facebook.com \"${n}\"${suffix}`];

function slugify(x){return String(x||"site").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"site";}
async function downloadSitePDF(){
 collectBuilder();
 const s=state.site||{};
 const name=slugify(s.name||"site-cakto");
 toast("Preparando PDF...");
 // Best result: render the complete client site. If the PDF libraries are unavailable,
 // open the browser print dialog so the user can choose "Salvar como PDF".
 const temp=document.createElement("div");
 temp.style.cssText="position:fixed;left:-100000px;top:0;width:1100px;background:#fff;z-index:-1";
 temp.innerHTML=clientSiteMarkup();
 document.body.appendChild(temp);
 try{
   if(window.html2canvas && window.jspdf && window.jspdf.jsPDF){
     const canvas=await html2canvas(temp.firstElementChild,{scale:1.5,useCORS:true,backgroundColor:"#ffffff",logging:false});
     const {jsPDF}=window.jspdf;
     const pdf=new jsPDF("p","mm","a4");
     const pageW=210,pageH=297;
     const imgW=pageW,imgH=canvas.height*pageW/canvas.width;
     let y=0,remaining=imgH;
     while(remaining>0){
       pdf.addImage(canvas.toDataURL("image/jpeg",.92),"JPEG",0,y,imgW,imgH);
       remaining-=pageH;
       if(remaining>0){pdf.addPage();y-=pageH;}
     }
     pdf.save(name+".pdf");
     toast("PDF baixado ✓");
   }else{
     openPrintFallback(temp,name);
   }
 }catch(err){
   console.warn(err);
   openPrintFallback(temp,name);
 }finally{
   setTimeout(()=>temp.remove(),1000);
 }
}
function openPrintFallback(container,name){
 const w=window.open("","_blank");
 if(!w){toast("Permita abrir a janela de impressão para salvar o PDF.","error");return}
 w.document.write(`<!doctype html><html><head><title>${esc(name)}</title><style>body{margin:0;font-family:Arial}.client-site{background:#fff} @media print{.client-site{width:100%}}</style></head><body>${container.innerHTML}<script>window.onload=()=>setTimeout(()=>window.print(),500)<\/script></body></html>`);
 w.document.close();
 toast("Escolha 'Salvar como PDF' na impressão.");
}
